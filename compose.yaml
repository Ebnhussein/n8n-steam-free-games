services:
  steam-helper:
    build: .
    restart: unless-stopped
    init: true
    environment:
      DATA_DIR: /data
    volumes:
      - steam_data:/data
    networks:
      - steam
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  steam:
    name: steam-free-games
volumes:
  steam_data:
